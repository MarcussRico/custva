services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: custva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env.example
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - redis
      - postgres
    env_file:
      - ../.env.example

volumes:
  postgres_data:
